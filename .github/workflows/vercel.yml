name: Deploy web to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel project settings
        run: npx vercel@latest pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build preview
        if: github.event_name == 'pull_request'
        run: npx vercel@latest build --token="$VERCEL_TOKEN"

      - name: Build production
        if: github.event_name == 'push'
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: github.event_name == 'push'
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
